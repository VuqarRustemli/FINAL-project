<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/profile.css">
    <title>Profile</title>
</head>

<body>
    <div class="top-banner">
        Summer Sale For All Swim Suits And Free Express Delivery - OFF 50%!
        <a href="#">ShopNow</a>
    </div>


    <nav class="navbar">
        <div class="logo">E-commerce</div>
        <ul class="menu">
            <li><a href="./index.html" class="active">Home</a></li>
            <li><a href="./contact.html">Contact</a></li>
            <li><a href="./about.html">About</a></li>
            <li><a href="./register.html">Sign Up</a></li>
            <li><a href="./shop.html" class="shop-btn">Shop</a></li>
        </ul>

        <div class="search-box">
            <input type="text" placeholder="What are you looking for?" />
            <i class="fa fa-search"></i>
        </div>

        <div class="icons">
            <div class="cart">
                <a href="./cart.html"><i class="fa fa-shopping-cart"></i></a>
                <span class="cart-count">6</span>
            </div>
            <!-- <img src="https://i.pravatar.cc/40" class="avatar" alt="user" /> -->
            <a href="./profile.html"><i class="fa-solid fa-user"></i></a>
            <span id="username">username</span>
            <button class="logout-btn">Log out</button>
        </div>
    </nav>
    <main>
        <div class="sub-main">
            <button href="./userproducts.html" class="product-btn">My products for sale</button>
            <div class="user-details">
                <h3>User Details</h3>
                <p><b>Name: </b><span id="user-name"></span></p>
                <p><b>Surname: </b><span id="user-surname"></span></p>
                <p><b>Email: </b><span id="user-email"></span></p>
                <p><b>Username: </b><span id="user-username"></span></p>
            </div>
        </div>
    </main>

    <!-- <script src="./js/script.js"></script> -->
    <script src="./js/profile.js"></script>
</body>

</html>
