<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/createproduct.css">
    <title>New Product</title>
</head>

<body>
    <div class="top-banner">
        Summer Sale For All Swim Suits And Free Express Delivery - OFF 50%!
        <a href="#">ShopNow</a>
    </div>


    <nav class="navbar">
        <div class="logo">E-commerce</div>
        <ul class="menu">
            <li><a href="./index.html" class="active">Home</a></li>
            <li><a href="./contact.html">Contact</a></li>
            <li><a href="./about.html">About</a></li>
            <li><a href="./register.html">Sign Up</a></li>
            <li><a href="./shop.html" class="shop-btn">Shop</a></li>
        </ul>

        <div class="search-box">
            <input type="text" placeholder="What are you looking for?" />
            <i class="fa fa-search"></i>
        </div>

        <div class="icons">
            <div class="cart">
                <a href="./cart.html"><i class="fa fa-shopping-cart"></i></a>
                <span class="cart-count">6</span>
            </div>
            <!-- <img src="https://i.pravatar.cc/40" class="avatar" alt="user" /> -->
            <a href="./profile.html"><i class="fa-solid fa-user"></i></a>
            <span id="username">username</span>
            <button class="logout-btn">Log out</button>
        </div>
    </nav>
    <main>
        <div class="sub-main">
            <h3>Create Product</h3>
            <form id="add-product">
                <div class="mb-2">
                    <label for="exampleFormControlInput1" class="form-label">Brand</label>
                    <input class="form-control" id="brand" type="text" autocomplete="off">
                </div>
                <div class="mb-2">
                    <label for="exampleFormControlInput1" class="form-label">Model</label>
                    <input type="text" id="model" class="form-control" autocomplete="off">
                </div>
                <div class="mb-2">
                    <label for="categorySelect" class="form-label">Category</label>
                    <div class="position-relative">
                        <select id="categorySelect" class="form-control" required
                            style="appearance: none; -webkit-appearance: none; -moz-appearance: none; padding-right: 2rem;">
                            <option value="">Select Category</option>
                        </select>
                        <span
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none;">▼</span>
                    </div>
                </div>
                <div class="mb-2">
                    <label for="exampleFormControlTextarea1" class="form-label">Description</label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                </div>
                <div class="mb-2">
                    <label for="exampleFormControlInput1" class="form-label">Price</label>
                    <input type="number" id="price" step="0.01" class="form-control" autocomplete="off">
                </div>
                <!-- <div class="mb-2">
                    <label for="exampleFormControlInput1" class="form-label">Rating</label>
                    <input type="number" id="rating" class="form-control" autocomplete="off">
                </div> -->
                <div class="mb-2">
                    <label for="exampleFormControlInput1" class="form-label">Img Url</label>
                    <input type="text" id="img-url" class="form-control" autocomplete="off">
                </div>
                <button type="submit" class="btn btn-success">Send</button>
            </form>
        </div>
    </main>

    <script src="./js/script.js"></script>
    <script src="./js/new-product.js"></script>
</body>

</html>
